<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevControls</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        html, body { margin: 0; padding: 0; height: 100%; background: #101225; }
        canvas { display: block; }
        /* Real-sized but parked off-screen — YouTube refuses to play in a 1x1 / display:none iframe. */
        #yt-host { position: fixed; bottom: 0; left: 0; width: 320px; height: 180px; opacity: 0.01; pointer-events: none; z-index: -1; }

        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1c38 0%, #0d0e1b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        .loader-graphics {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #6c7bff;
            border-bottom-color: #ff5252;
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .loader-ring-inner {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-left-color: #22ffaa;
            border-right-color: #ffd700;
            animation: spin-reverse 2s linear infinite;
            opacity: 0.8;
        }

        .loader-core {
            position: absolute;
            top: 32px;
            left: 32px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #6c7bff 0%, #3b429f 100%);
            box-shadow: 0 0 20px rgba(108, 123, 255, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        .loader-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #6c7bff, #22ffaa, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow-text 3s ease-in-out infinite;
            margin-bottom: 8px;
        }

        .loader-subtext {
            font-size: 12px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .loader-bar {
            width: 150px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            position: absolute;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #6c7bff, #22ffaa);
            border-radius: 3px;
            animation: progress-slide 1.8s infinite ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 30px rgba(108, 123, 255, 0.9); }
        }

        @keyframes glow-text {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px rgba(108, 123, 255, 0.3)); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(34, 255, 170, 0.6)); }
        }

        @keyframes progress-slide {
            0% { left: -50%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
<div id="loading-container">
    <div class="loader-graphics">
        <div class="loader-ring"></div>
        <div class="loader-ring-inner"></div>
        <div class="loader-core"></div>
    </div>
    <div class="loader-text">DevControls</div>
    <div class="loader-subtext">Initializing Web Sandbox...</div>
    <div class="loader-bar">
        <div class="loader-progress"></div>
    </div>
</div>
<canvas id="ComposeTarget"></canvas>

<!-- YouTube IFrame Player API + a tiny control surface (window.__yt) used by the web MediaController.
     The host div is attached to <html> so Compose taking over <body> can't remove it. -->
<script>
  (function () {
    var player = null, ready = false, pendingId = null;
    window.__ytLog = [];
    function log(m) { window.__ytLog.push(m); console.log("[yt] " + m); }

    // host div on <html> so it survives Compose's <body> rendering
    var host = document.createElement('div');
    host.id = 'yt-host';
    var inner = document.createElement('div');
    inner.id = 'yt-player';
    host.appendChild(inner);
    document.documentElement.appendChild(host);

    window.onYouTubeIframeAPIReady = function () {
      log("IFrame API ready, creating player");
      player = new YT.Player('yt-player', {
        height: '180', width: '320',
        playerVars: { 'playsinline': 1 },
        events: {
          'onReady': function () {
            ready = true; log("player ready");
            if (pendingId) { player.loadVideoById(pendingId); pendingId = null; }
          },
          'onError': function (e) { log("player error " + e.data); },
          'onStateChange': function (e) { log("state " + e.data); }
        }
      });
    };

    window.__yt = {
      load: function (id) {
        log("load " + id);
        if (ready && player) { player.loadVideoById(id); player.playVideo(); }
        else pendingId = id;
      },
      play: function () { if (player && player.playVideo) player.playVideo(); },
      pause: function () { if (player && player.pauseVideo) player.pauseVideo(); },
      seek: function (s) { if (player && player.seekTo) player.seekTo(s, true); },
      timeMs: function () { return (player && player.getCurrentTime) ? player.getCurrentTime() * 1000 : 0; },
      durationMs: function () { return (player && player.getDuration) ? player.getDuration() * 1000 : 0; },
      state: function () { return (player && player.getPlayerState) ? player.getPlayerState() : -1; },
      ready: function () { return ready; }
    };
    log("bridge installed");
  })();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="devcontrols.js"></script>
</body>
</html>
